name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Validate server.json against MCP registry schema
        run: |
          curl -fsSL -o /tmp/schema.json https://static.modelcontextprotocol.io/schemas/2025-10-17/server.schema.json
          npx --yes ajv-cli@5 validate -s /tmp/schema.json -d packages/naver-commerce/server.json --spec=draft7 --strict=false
