name: Canary (nightly real-API checks)

on:
  schedule:
    - cron: "0 20 * * *"        # 05:00 KST
  workflow_dispatch:
    inputs:
      platform:
        description: "Only this platform (blank = all)"
        required: false
        default: ""
      runner:
        description: "self-hosted (Mac mini, KR IP — default) or cloud (ubuntu, no Naver/data.go.kr access)"
        required: false
        default: "self-hosted"

concurrency: canary

jobs:
  live:
    # Naver Commerce (IP allow-list) and data.go.kr/juso (KR-only) are unreachable from GitHub's cloud runners,
    # so the nightly run uses the self-hosted runner on the Mac mini (KR residential IP, already allow-listed).
    runs-on: ${{ github.event.inputs.runner == 'cloud' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    permissions:
      contents: write          # push status branch
      issues: write            # open/close canary issues
    env:
      TZ: Asia/Seoul
      CANARY_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANARY_DATABASE_URL: ${{ secrets.CANARY_DATABASE_URL }}
      # static keys — add in Settings → Secrets → Actions
      CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
      CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
      CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
      CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
      NAVER_COMMERCE_CLIENT_ID: ${{ secrets.NAVER_COMMERCE_CLIENT_ID }}
      NAVER_COMMERCE_CLIENT_SECRET: ${{ secrets.NAVER_COMMERCE_CLIENT_SECRET }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      JUSO_KEY: ${{ secrets.JUSO_KEY }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      YAHOO_JP_APP_ID: ${{ secrets.YAHOO_JP_APP_ID }}
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      COUPANG_VENDOR_ID: ${{ secrets.COUPANG_VENDOR_ID }}
      POPBILL_LINK_ID: ${{ secrets.POPBILL_LINK_ID }}
      POPBILL_SECRET_KEY: ${{ secrets.POPBILL_SECRET_KEY }}
      POPBILL_CORP_NUM: ${{ secrets.POPBILL_CORP_NUM }}
      DELIVERY_TRACKER_CLIENT_ID: ${{ secrets.DELIVERY_TRACKER_CLIENT_ID }}
      DELIVERY_TRACKER_CLIENT_SECRET: ${{ secrets.DELIVERY_TRACKER_CLIENT_SECRET }}
      CANARY_TRACKING: ${{ secrets.CANARY_TRACKING }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run live checks + change watch
        run: |
          cd packages/canary
          node dist/cli.js run --live --alert --status-dir "$RUNNER_TEMP/status" ${{ inputs.platform && format('--platform {0}', inputs.platform) || '' }} | tee "$GITHUB_STEP_SUMMARY"
      - name: Publish status to canary-status branch
        if: always()
        run: |
          set -e
          S="$RUNNER_TEMP/status-repo"; rm -rf "$S"; mkdir -p "$S"
          if git ls-remote --exit-code --heads origin canary-status >/dev/null 2>&1; then
            git clone -q --depth 1 --branch canary-status "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$S"
          else
            git -C "$S" init -q -b canary-status
          fi
          git -C "$S" config user.name "kmcp-canary"; git -C "$S" config user.email "canary@appmonster.co.kr"
          mkdir -p "$S/status" "$S/snapshots"
          cp -r "$RUNNER_TEMP/status/." "$S/status/" 2>/dev/null || true
          cp -r packages/canary/snapshots/. "$S/snapshots/" 2>/dev/null || true
          printf '# canary-status\n\nMachine-written by .github/workflows/canary.yml. Latest: status/latest.md\n' > "$S/README.md"
          cd "$S" && git add -A && (git commit -q -m "canary $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit")
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:canary-status
