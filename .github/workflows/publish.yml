name: Publish

# Tag a package release as  naver-commerce-v0.1.0  → publishes to npm, then to the official MCP Registry.
on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: read
  id-token: write # npm provenance + mcp-publisher GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve package + version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"            # e.g. naver-commerce-v0.1.0
          PKG="${TAG%-v*}"                    # naver-commerce
          VER="${TAG##*-v}"                   # 0.1.0
          DIR="packages/${PKG}"
          test -d "$DIR" || { echo "no package dir $DIR"; exit 1; }
          PKG_VER=$(node -p "require('./$DIR/package.json').version")
          SRV_VER=$(node -p "require('./$DIR/server.json').version")
          [ "$PKG_VER" = "$VER" ] || { echo "package.json version $PKG_VER != tag $VER"; exit 1; }
          [ "$SRV_VER" = "$VER" ] || { echo "server.json version $SRV_VER != tag $VER"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Publish to npm (with provenance) — skipped if this version already exists
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          ENC=$(node -p "encodeURIComponent('$NAME')")
          if curl -fsS "https://registry.npmjs.org/$ENC/$VER" >/dev/null 2>&1; then
            echo "$NAME@$VER already on npm — skipping publish"
          else
            pnpm publish --access public --no-git-checks --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait until npm serves this version (staged publishes need approval on npmjs.com)
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          ENC=$(node -p "encodeURIComponent('$NAME')")
          for i in $(seq 1 40); do
            if curl -fsS "https://registry.npmjs.org/$ENC/$VER" >/dev/null 2>&1; then echo "npm has $NAME@$VER"; exit 0; fi
            echo "waiting for $NAME@$VER on npm ($i/40)…"; sleep 15
          done
          echo "::error::$NAME@$VER is not public on npm. If the package is staged, approve it at https://www.npmjs.com/settings/appmonster/staged-packages and re-run this job."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to MCP Registry
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
